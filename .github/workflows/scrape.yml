name: Daily Fanqie Rank Scraper

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-rank-writes-main
  cancel-in-progress: false

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动在界面上点击 Run workflow

jobs:
  scrape-and-commit:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Check missing ranks for today
      id: check_data
      run: |
        TODAY=$(date -u +"%Y%m%d")
        ALL_RANKS=$(python3 -c "from rank_config import RANK_IDS; print(' '.join(RANK_IDS))")
        MISSING=""
        for RANK in $ALL_RANKS; do
          FILE="data/fanqie_${RANK}_ranks_${TODAY}.json"
          if [ -f "$FILE" ]; then
            echo "✅ 已存在: $FILE"
          else
            echo "📭 缺失: $FILE"
            MISSING="${MISSING},${RANK}"
          fi
        done
        MISSING="${MISSING#,}"
        if [ -n "$MISSING" ]; then
          echo "missing=true" >> $GITHUB_OUTPUT
          echo "ranks=$MISSING" >> $GITHUB_OUTPUT
          echo "需要爬取的榜单: $MISSING"
        else
          echo "missing=false" >> $GITHUB_OUTPUT
          echo "✅ 全部榜单今日数据已存在，跳过爬取"
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ steps.check_data.outputs.missing }}" = "true" ]; then
          playwright install --with-deps chromium
        fi

    - name: Run Scraper
      if: steps.check_data.outputs.missing == 'true'
      run: python scrape_fanqie_ranks.py --ranks ${{ steps.check_data.outputs.ranks }}
      env:
        GITHUB_ACTIONS: true

    - name: Build Latest Data with AI Summary
      run: pip install openai && python scripts/build_latest.py
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[Auto] Update Fanqie daily ranks"
        file_pattern: data api
        branch: main

    # ---- Deploy to GitHub Pages (inline, 绕过 GITHUB_TOKEN 不触发其他 workflow 的限制) ----
    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
